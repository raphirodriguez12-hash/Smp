<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#0a0a0f" />
    <title>Stack Escape</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html, body {
        width: 100%;
        height: 100%;
        background: #0a0a0f;
        overflow: hidden;
        touch-action: none;
        -webkit-tap-highlight-color: transparent;
        -webkit-user-select: none;
        user-select: none;
      }

      #game-container {
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      canvas {
        display: block;
        image-rendering: pixelated;
        touch-action: none;
      }

      /* Banner ad slot - shown in menu only */
      #banner-ad {
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        height: 60px;
        background: transparent;
        display: none;
        align-items: center;
        justify-content: center;
        z-index: 100;
      }

      #banner-ad.visible {
        display: flex;
      }

      /* Mock banner for testing (replaced by real AdMob in production) */
      #banner-ad-mock {
        width: 320px;
        height: 50px;
        background: rgba(255,255,255,0.05);
        border: 1px solid rgba(255,255,255,0.1);
        border-radius: 4px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: rgba(255,255,255,0.3);
        font-family: Arial, sans-serif;
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <div id="game-container"></div>
    <div id="banner-ad">
      <div id="banner-ad-mock">ANNONCE BANNIÈRE</div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
